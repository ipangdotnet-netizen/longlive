    return n;
  }
  function pathD(pts) {
    let d = 'M' + pts[0].x.toFixed(3) + ' ' + pts[0].y.toFixed(3);
    for (let i = 1; i < pts.length; i++) d += 'L' + pts[i].x.toFixed(3) + ' ' + pts[i].y.toFixed(3);
    return d + 'Z';
  }
  function centerAt(pts, cx, cy) {
    const b = G.bbox(pts);
    const dx = cx - (b.x0 + b.x1) / 2, dy = cy - (b.y0 + b.y1) / 2;
    return pts.map((p) => Object.assign({}, p, { x: p.x + dx, y: p.y + dy }));
  }

  /* ---------------- 建图形 ---------------- */
  function buildShape(kind) {
    state.kind = kind;
    const real = kind === 'random' ? SHAPE_KINDS[Math.floor(Math.random() * SHAPE_KINDS.length)] : kind;
    state.realKind = real;
    let poly, name = '', meta = {}, note = SHAPE_NOTE[real] || '';
    let needPlace = true;

    if (real === 'circle') {
      /* 圆心取格点，半径取整数 → 左右上下四个点也在格点上 */
      const r = Math.random() < 0.5 ? 2 : 3;
      const ccx = I(6, 7), ccy = I(4, 5);
      poly = G.circlePoints(ccx, ccy, r, 360);
      meta = { circle: { cx: ccx, cy: ccy, r } };
      name = '圆形';
      needPlace = false;
    } else if (real === 'concave') {
      if (Math.random() < 0.55) {
        const n = Math.random() < 0.55 ? 5 : 6;
        poly = intStarPoly(n) || G.starPolygon(n, 0, 0, 3, 1.15, -Math.PI / 2);
        name = (CN[n] || n) + '角星';
      } else {
        const w = I(5, 6), h = I(4, 5), a = I(2, 3), b = I(2, 3);
        poly = G.lShape(0, 0, w, h, a, b, Math.random() < 0.5);
        name = 'L 形';
      }
    } else if (real === 'regular') {
      const n = clamp(state.ngon, 3, 12);
      state.ngon = n;
      const ccx = I(6, 7), ccy = I(4, 5);
      /* 正四边形取整数半径，四个顶点正好在格点上；其它正多边形只能保证中心在格点 */
      const R = n === 4 ? I(2, 3) : rnd(2.75, 3.15);
      poly = G.regularPolygon(n, ccx, ccy, R, -Math.PI / 2, 0);
      name = n === 3 ? '正三角形' : n === 4 ? '正方形' : '正' + (CN[n] || n) + '边形';
      needPlace = false;
    } else if (real === 'star') {
      const n = clamp(state.ngon, 5, 12);
      state.ngon = n;
      const R = rnd(2.9, 3.2);
      const rin = (R * Math.cos((2 * Math.PI) / n)) / Math.cos(Math.PI / n);
      poly = G.starPolygon(n, I(6, 7), I(4, 5), R, rin, -Math.PI / 2);
      name = '正' + (CN[n] || n) + '角星';
      needPlace = false;
    } else if (real === 'polygon') {
      const n = clamp(state.ngon, 3, 12);
      state.ngon = n;
      poly = intPolygon(n) || G.regularPolygon(n, 0, 0, rnd(2.6, 3.1), Math.random() * Math.PI * 2, 0.09);
      name = n === 3 ? '三角形' : (CN[n] || n) + '边形';
    } else {
      poly = BUILDERS[real]();
      name = SHAPE_NAME[real];
    }
    if (needPlace) poly = placeOnGrid(poly);
    if (real !== 'circle') poly = poly.map((q) => Object.assign({}, q, { corner: true }));

    state.name = name;
    state.note = note;
    state.meta = meta;
    state.poly0 = poly;
    state.pieces = [{
      pts: poly, m: idM(), fromCircle: real === 'circle', circle: meta.circle || null,
      lp: null, seams: [], fresh: false,
      desc: real === 'circle' ? '圆形' : G.classifyShape(poly)
    }];
    state.cuts = [];
    state.history = [];
    state.confirmed = false;
    state.mode = 'cut';
    state.sel = -1;
    state.cutStart = null;
    state.hoverBoundary = null;
    state.cursorWorld = null;
    state.tdrag = null;
    state.corners = cornersOf(state.pieces);
    const nInput = $('#shapeN');
    const isStar = real === 'star';
    nInput.value = state.ngon;
    nInput.min = isStar ? 5 : 3;
    $('#shapeCountRow').hidden = !['regular', 'star', 'polygon'].includes(real);
    $('#shapeCountLabel').textContent = isStar ? '角数' : '边数';
    $('#shapeCountRange').textContent = isStar ? '5–12 角' : '3–12 边';
    const sel = document.getElementById('shapeSelect');
    if (sel) sel.value = kind;
    renderAll();
  }

  /* ---------------- 数据 ---------------- */
  function origStats() {
    const p = state.poly0;
    if (state.meta.circle) {
      const r = state.meta.circle.r;
      return { isCircle: true, r, d: r * 2, area: Math.PI * r * r, perim: 2 * Math.PI * r, n: 0, angles: 0 };
    }
    return {
      isCircle: false,
      n: p.length,
      area: Math.abs(G.polyArea(p)),
      perim: G.polyPerim(p),
      angles: (p.length - 2) * 180
    };
  }

  function pieceArea(pc) { return Math.abs(G.polyArea(pc.pts)); }
  function pieceInfos() {
    return state.pieces.map((pc, i) => ({
      i, area: pieceArea(pc), perim: G.polyPerim(pc.pts),
      color: COLORS[i % COLORS.length], desc: pc.desc
    }));
  }

  function arcEdge(a, b) {
    if (!a.arcEdges || !b.arcEdges) return undefined;
    return a.arcEdges.find((edge) => b.arcEdges.includes(edge));
  }

  function worldCircle(pc) {
    if (!pc.circle) return null;
    const { cx, cy, r } = pc.circle;
    const center = G.applyM(pc.m, { x: cx, y: cy });
    return { cx: center.x, cy: center.y, r };
  }

  function describeRing(pts, circle) {
    if (!circle) return G.classifyShape(pts);
    const n = pts.length;
    const isArc = pts.map((p, i) => arcEdge(p, pts[(i + 1) % n]) !== undefined);
    if (isArc.every(Boolean)) return '圆形';
    if (!isArc.some(Boolean)) return G.classifyShape(pts);
    const arcs = isArc.filter((arc, i) => arc && !isArc[(i + n - 1) % n]).length;
    const straights = isArc.filter((arc) => !arc).length;
    if (arcs === 1 && straights === 1) {
      const i = isArc.indexOf(false);
      const a = pts[i], b = pts[(i + 1) % n];
      const midpoint = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const center = { x: circle.cx, y: circle.cy };
      const isDiameter = G.dist(midpoint, center) < circle.r * 0.001
        && Math.abs(G.dist(a, b) - 2 * circle.r) < circle.r * 0.002;
      return isDiameter ? '半圆' : '弓形';
    }
    if (arcs === 1) return '弧 + ' + straights + ' 条直边';
    return arcs + ' 段弧 + ' + straights + ' 条直边';
  }

  function seamTotal() { return state.cuts.reduce((s, c) => s + c.seamLen, 0); }

  function cornersOf(pieces) {
    const out = [];
    for (const pc of pieces) {
      const pts = worldPts(pc), n = pts.length;
      for (let i = 0; i < n; i++) {
        const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
        const ux = a.x - b.x, uy = a.y - b.y, vx = c.x - b.x, vy = c.y - b.y;
        const lu = Math.hypot(ux, uy) || 1, lv = Math.hypot(vx, vy) || 1;
        const ang = Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / (lu * lv))));
        if (ang > 0.35) out.push({ x: b.x, y: b.y });
      }
    }
    return out;
  }

  /* ---------------- 渲染 ---------------- */
  function renderAll() {
    renderPieces();
    renderFace();
    renderMarks();
    renderSelection();
    renderPreview();
    updateHead();
    renderPanel();
    state.pieces.forEach((p) => { p.fresh = false; });
  }

  function renderPieces() {
    const layer = $('#piecesLayer');
    layer.innerHTML = '';
    const order = state.pieces.map((_, i) => i);
    if (state.sel >= 0 && state.mode === 'move') {
      const k = order.indexOf(state.sel);
      if (k >= 0) { order.splice(k, 1); order.push(state.sel); }
    }
    for (const i of order) {
      const pc = state.pieces[i];
      const g = mk('g', { 'data-i': i, transform: matStr(pc.m) }, layer);
      const p = mk('path', {
        d: pathD(pc.pts),
        fill: COLORS[i % COLORS.length],
        stroke: '#22324F',
        'stroke-width': '0.055',
        'stroke-linejoin': 'round',
        filter: 'url(#pieceShadow)'
      }, g);
      p.setAttribute('class', 'piece' + (pc.fresh ? ' pop' : ''));
      if (pc.fresh) p.style.animationDelay = (i * 0.035) + 's';
      for (const seg of pc.seams || []) {
        mk('line', {
          x1: seg[0].x.toFixed(3), y1: seg[0].y.toFixed(3),
          x2: seg[1].x.toFixed(3), y2: seg[1].y.toFixed(3),
          stroke: '#B07A17', 'stroke-width': '0.05', 'stroke-dasharray': '0.17 0.13',
          'stroke-linecap': 'round', opacity: '0.95', class: 'seamline'
        }, g);
      }
      if (state.showAngles) drawAngleMarks(g, pc);
    }
  }

  /* 原图的角还完整保留时，画一个角符号（直角用直角符号） */
  function drawAngleMarks(g, pc) {
    if (pieceArea(pc) < 0.5) return;
    const pts = pc.pts;
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      if (!p.corner) continue;
      const prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n];
      const l1 = G.dist(prev, p), l2 = G.dist(next, p);
      if (l1 < 0.12 || l2 < 0.12) continue;
      const a1 = Math.atan2(prev.y - p.y, prev.x - p.x);
      const a2 = Math.atan2(next.y - p.y, next.x - p.x);
      let d = a2 - a1;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      const r = Math.max(0.1, Math.min(0.3, 0.22 * Math.min(l1, l2)));
      const deg = (Math.abs(d) * 180) / Math.PI;
      let path;
      if (Math.abs(deg - 90) < 1.5) {
        const x1 = p.x + Math.cos(a1) * r, y1 = p.y + Math.sin(a1) * r;
        const x2 = p.x + Math.cos(a2) * r, y2 = p.y + Math.sin(a2) * r;
        path = 'M' + x1.toFixed(3) + ' ' + y1.toFixed(3) + 'L' + (x1 + x2 - p.x).toFixed(3) + ' ' + (y1 + y2 - p.y).toFixed(3) + 'L' + x2.toFixed(3) + ' ' + y2.toFixed(3);
      } else {
        const inside = (dd) => {
          const mid = a1 + dd / 2;
          return G.pointInPoly(pts, { x: p.x + Math.cos(mid) * r * 0.55, y: p.y + Math.sin(mid) * r * 0.55 });
        };
        let dd = d;
        if (!inside(dd)) dd = d > 0 ? d - 2 * Math.PI : d + 2 * Math.PI;
        const x1 = p.x + Math.cos(a1) * r, y1 = p.y + Math.sin(a1) * r;
        const x2 = p.x + Math.cos(a1 + dd) * r, y2 = p.y + Math.sin(a1 + dd) * r;
        const large = Math.abs(dd) > Math.PI ? 1 : 0;
        const sweep = dd > 0 ? 1 : 0;
        path = 'M' + x1.toFixed(3) + ' ' + y1.toFixed(3) + 'A' + r.toFixed(3) + ' ' + r.toFixed(3) + ' 0 ' + large + ' ' + sweep + ' ' + x2.toFixed(3) + ' ' + y2.toFixed(3);
      }
      mk('path', {
        d: path, fill: 'none', stroke: '#22324F', 'stroke-width': '0.03',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: '0.72', class: 'amark'
      }, g);
    }
  }

  function renderFace() {
    const layer = $('#faceLayer');
    layer.innerHTML = '';
    if (state.cuts.length > 0 || state.pieces.length !== 1) return;
    const pc = state.pieces[0];
    const pts = pc.pts;
    const c = pc.fromCircle ? G.polyCentroid(pts) : G.innerPoint(pts);
    const bb = G.bbox(pts);
    const s = Math.max(0.6, Math.min(1.2, Math.min(bb.w, bb.h) / 5));
    const g = mk('g', { id: 'faceG', class: 'face', transform: matStr(pc.m) }, layer);
    for (const dx of [-0.56, 0.56]) {
      mk('ellipse', {
        cx: (c.x + dx * s).toFixed(3), cy: (c.y - 0.06 * s).toFixed(3),
        rx: (0.13 * s).toFixed(3), ry: (0.17 * s).toFixed(3),
        fill: '#22324F', class: 'eye'
      }, g);
    }
    mk('path', {
      d: `M${(c.x - 0.42 * s).toFixed(3)} ${(c.y + 0.2 * s).toFixed(3)} q${(0.42 * s).toFixed(3)} ${(0.38 * s).toFixed(3)} ${(0.84 * s).toFixed(3)} 0`,
      fill: 'none', stroke: '#22324F', 'stroke-width': (0.075 * s).toFixed(3), 'stroke-linecap': 'round'
    }, g);
  }

  function renderMarks() {
    const layer = $('#labelLayer');
    layer.innerHTML = '';
    const many = state.pieces.length > 6;
    const showNum = state.pieces.length > 1;
    state.pieces.forEach((pc, i) => {
      if (!showNum) return;
      const area = pieceArea(pc);
      if (area < 0.7) return;
      if (!pc.lp) pc.lp = G.innerPoint(pc.pts);
      const p = G.applyM(pc.m, pc.lp);
      const tiny = area < 2.2;
      const ny = state.confirmed ? (tiny ? -0.1 : -0.13) : 0;
      const t = mk('text', {
        id: 'num-' + i,
        x: p.x.toFixed(3), y: (p.y + ny).toFixed(3),
        'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': tiny ? '0.25' : many ? '0.28' : '0.36',
        'font-weight': '800', fill: '#22324F', stroke: '#FFFCF3',
        'stroke-width': '0.085', 'paint-order': 'stroke', class: 'mark'
      }, layer);
      t.textContent = numChar(i);
      pc._off = { ny, ay: tiny ? 0.2 : 0.26, af: tiny ? '0.15' : many ? '0.17' : '0.19' };
      if (state.confirmed) {
        const s = mk('text', {
          id: 'area-' + i,
          x: p.x.toFixed(3), y: (p.y + pc._off.ay).toFixed(3),
          'text-anchor': 'middle', 'dominant-baseline': 'central',
          'font-size': pc._off.af, 'font-weight': '700', fill: '#3B4A66',
          stroke: '#FFFCF3', 'stroke-width': '0.06', 'paint-order': 'stroke', class: 'mark'
        }, layer);
        s.textContent = measured(area, pc.fromCircle) + ' cm²';
      }
    });
  }

  function handlePos(pc) {
    const b = G.bbox(worldPts(pc));
    const hx = (b.x0 + b.x1) / 2;
    const hy = b.y0 - 0.46 < 0.3 ? b.y1 + 0.46 : b.y0 - 0.46;
    return { x: hx, y: hy };
  }

  function renderSelection() {
    const layer = $('#selLayer');
    layer.innerHTML = '';
    if (state.mode === 'resize') {
      const pc0 = state.pieces[0];
      if (!pc0) return;
      mk('path', {
        d: pathD(worldPts(pc0)), fill: 'none', stroke: '#D9A537', 'stroke-width': '0.045',
        'stroke-dasharray': '0.13 0.12', 'stroke-linejoin': 'round'
      }, layer);
      if (state.hoverV) {
        mk('circle', {
          cx: state.hoverV.x.toFixed(3), cy: state.hoverV.y.toFixed(3), r: '0.2',
          fill: '#FFFCF3', stroke: '#22324F', 'stroke-width': '0.05', class: 'vhandle'
        }, layer);
        mk('circle', {
          cx: state.hoverV.x.toFixed(3), cy: state.hoverV.y.toFixed(3), r: '0.075',
          fill: '#D9A537'
        }, layer);
      }
      return;
    }
    const i = state.sel;
    if (i < 0 || state.mode !== 'move' || !state.pieces[i]) return;
    const pc = state.pieces[i];
    const wp = worldPts(pc);
    mk('path', {
      d: pathD(wp), fill: 'none', stroke: '#D9A537', 'stroke-width': '0.055',
      'stroke-dasharray': '0.16 0.12', 'stroke-linejoin': 'round'
    }, layer);
    if (state.snapSegs) {
      for (const sg of state.snapSegs) {
        mk('line', {
          x1: sg[0].x.toFixed(3), y1: sg[0].y.toFixed(3),
          x2: sg[1].x.toFixed(3), y2: sg[1].y.toFixed(3),
          stroke: '#E8B23F', 'stroke-width': '0.11', 'stroke-linecap': 'round', opacity: '0.95'
        }, layer);
      }
    }
    const h = handlePos(pc);
    const c = G.polyCentroid(wp);
    mk('line', {
      x1: c.x.toFixed(3), y1: c.y.toFixed(3), x2: h.x.toFixed(3), y2: h.y.toFixed(3),
      stroke: '#D9A537', 'stroke-width': '0.03', 'stroke-dasharray': '0.07 0.09', opacity: '0.85'
    }, layer);
    mk('circle', { cx: h.x.toFixed(3), cy: h.y.toFixed(3), r: '0.19', fill: '#FFFCF3', stroke: '#22324F', 'stroke-width': '0.05' }, layer);
    const t = mk('text', {
      x: h.x.toFixed(3), y: h.y.toFixed(3), 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': '0.21', fill: '#22324F', 'font-weight': '700'
    }, layer);
    t.textContent = '↻';
  }

  function renderPreview() {
    const layer = $('#previewLayer');
    layer.innerHTML = '';
    $('#stageWrap').classList.toggle('cutting', state.mode === 'cut');
    const a = state.cutStart;
    const hb = state.hoverBoundary;
    const previewHint = $('#previewHint');
    const preview = a && hb && G.dist(a, hb) >= 0.3 ? cutPlan(a, hb) : null;
    const message = preview?.message || '';
    if (previewHint.textContent !== message) previewHint.textContent = message;
    previewHint.hidden = !message;
    if (!a) {
      /* 还没选起点：在边界上给候选空心点，不在边界上给实心红点跟随鼠标 */
      if (hb) {
        mk('circle', {
          cx: hb.x.toFixed(3), cy: hb.y.toFixed(3), r: '0.11',
          fill: 'none', stroke: '#B07A17', 'stroke-width': '0.035', 'stroke-dasharray': '0.05 0.05'
        }, layer);
      } else if (state.cursorWorld) {
        mk('circle', {
          cx: state.cursorWorld.x.toFixed(3), cy: state.cursorWorld.y.toFixed(3), r: '0.075',
          fill: '#C25B4E', opacity: '0.9'
        }, layer);
      }
      return;
    }
    const b = hb || state.cursorWorld || a;
    const hasGap = Boolean(preview?.gaps?.length);
    const ok = Boolean(preview?.next);
    if (G.dist(a, b) > 1e-6) {
      mk('line', {
        x1: a.x.toFixed(3), y1: a.y.toFixed(3),
        x2: b.x.toFixed(3), y2: b.y.toFixed(3),
        stroke: ok || hasGap ? '#B07A17' : '#C25B4E',
        'stroke-width': '0.055', 'stroke-dasharray': '0.18 0.14', 'stroke-linecap': 'round', opacity: '0.95'
      }, layer);
    }
    if (hasGap) {
      for (const { start, end } of preview.gaps) {
        mk('line', {
          x1: start.x, y1: start.y, x2: end.x, y2: end.y,
          stroke: '#B64038', 'stroke-width': '0.08', 'stroke-linecap': 'round',
          class: 'preview-outside'
        }, layer);
      }
    }
    /* 起点、终点都用点表示 */
    mk('circle', { cx: a.x.toFixed(3), cy: a.y.toFixed(3), r: '0.09', fill: '#E8B23F', stroke: '#22324F', 'stroke-width': '0.035' }, layer);
    if (G.dist(a, b) > 1e-6) {
      mk('circle', {
        cx: b.x.toFixed(3), cy: b.y.toFixed(3), r: '0.09',
        fill: ok ? '#E8B23F' : '#C25B4E', stroke: ok ? '#22324F' : '#C25B4E', 'stroke-width': '0.03'
      }, layer);
    }
  }

  function updateHead() {
    $('#shapeName').textContent = state.name;
    const nP = state.pieces.length, nC = state.cuts.length;
    $('#stageMeta').textContent = nC === 0 ? '还没下刀' : `切成 ${nP} 块`;
    $('#pieceBadge').textContent = nP;
    $('#cutBadge').textContent = nC;

    const hint = $('#stageHint');
    if (state.confirmed) hint.textContent = '已展示数据 · 可拖开小块对比形状';
    else if (state.mode === 'resize') hint.textContent = state.showGrid ? '拖顶点改边长 · 已开启网格吸附' : '拖顶点改边长 · 网格吸附已关闭';
    else if (state.mode === 'move') hint.textContent = state.sel >= 0 ? '拖动小块移动 · 拖 ↻ 圆点旋转' : '点一下小块选中它';
    else if (state.cutStart) hint.textContent = '再点边界上的另一点，自动连线切开';
    else if (nC === 0) hint.textContent = '先点图形边上的一点，作为起点';
    else hint.textContent = '还可以再点两下再切一刀 · 或确认展示数据';

    $('#undoBtn').disabled = state.history.length === 0;
    const cb = $('#confirmBtn');
    if (state.confirmed) {
      cb.textContent = '↩ 继续划刀';
      cb.classList.remove('primary');
      cb.classList.add('ghost');
    } else {
      cb.textContent = '✓ 确认并展示数据';
      cb.classList.add('primary');
      cb.classList.remove('ghost');
    }
    $('#tipBubble').textContent = tipText();
    $$('#modeSwitch .mode-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === state.mode));
    $('#stageWrap').classList.toggle('move', state.mode === 'move');
    $('#stageWrap').classList.toggle('resize', state.mode === 'resize');
    updateMoveBar();
  }

  function updateMoveBar() {
    const bar = $('#moveBar');
    const isMove = state.mode === 'move', isResize = state.mode === 'resize';
    bar.hidden = !(isMove || isResize);
    if (bar.hidden) return;
    $('#mbTools').hidden = !isMove;
    if (isResize) {
      $('#selTag').innerHTML = '<span class="dim">改边长</span>';
      $('#moveBar .mb-hint').textContent = '鼠标移到顶点或圆周附近，出现小圆点后拖动';
      return;
    }
    $('#moveBar .mb-hint').textContent = '拖动小块移动 · 拖 ↻ 旋转';
    const i = state.sel;
    $('#selTag').innerHTML = i >= 0
      ? `<i class="swatch" style="background:${COLORS[i % COLORS.length]}"></i><b>${numChar(i)}</b><span class="mb-name">${state.pieces[i].desc}</span> · 面积 ${measured(pieceArea(state.pieces[i]), state.pieces[i].fromCircle)} cm²`
      : '<span class="dim">未选中</span>';
    $$('#mbTools .tbtn').forEach((b) => {
      if (b.dataset.act !== 'resetall') b.disabled = i < 0;
    });
  }

  function tipText() {
    if (state.mode === 'resize') return '拖动顶点可以改它两边长短，图形类型不变；圆就改半径。';
    if (state.mode === 'move') return state.sel >= 0 ? '转一转、翻个面，形状和面积都没变哦。' : '点一下小块，就能移动、旋转、翻面。';
    if (state.confirmed) return '每一块的面积加起来，正好等于原来的面积哦！';
    if (state.cuts.length === 0) return '先点图形边上的一点作为起点，再点边界另一点作为终点，就会切开这两点之间的线段。';
    if (state.pieces.length >= 4) return '切得越多，块越小；每一块的周长都会单独重新计算。';
    if (state.cuts.length === 1) return '总面积不变。各块周长加起来，多出了刀痕两侧的长度。';
    return '再划一刀试试，或者点「✓ 确认并展示数据」。';
  }

  /* ---------------- 面板 ---------------- */
  function renderPanel() {
    const st = origStats();
    $('#origBody').innerHTML = origHTML(st);
    $('#resultBody').innerHTML = resultHTML(st);
  }

  function origHTML(st) {
    const noteLine = state.note ? `<div class="note">${state.note}</div>` : '';
    if (st.isCircle) {
      return `
        <div class="stats">
          <div class="stat"><span>面积 πr²</span><b>${measured(st.area)}<em>cm²</em></b></div>
          <div class="stat"><span>周长 2πr</span><b>${measured(st.perim)}<em>cm</em></b></div>
        </div>
        <div class="kv"><span>形状</span><b>圆形</b></div>
        <div class="kv"><span>半径 r</span><b>${measured(st.r)} cm</b></div>
        <div class="kv"><span>直径 d</span><b>${measured(st.d)} cm</b></div>
        <div class="note">原图读数按圆的公式计算。分割后的圆弧用短线段近似。</div>`;
    }
    return `
      <div class="stats">
        <div class="stat"><span>面积</span><b>${measured(st.area)}<em>cm²</em></b></div>
        <div class="stat"><span>周长</span><b>${measured(st.perim)}<em>cm</em></b></div>
      </div>
      <div class="kv"><span>形状</span><b>${state.name}</b></div>
      <div class="kv"><span>边数 / 顶点数</span><b>${st.n} 个</b></div>
      <div class="kv"><span>内角和</span><b>${st.angles}° <span style="color:#9AA6BB;font-weight:600">= (${st.n}−2)×180°</span></b></div>
      ${noteLine}`;
  }

  function resultHTML(st) {
    if (state.pieces.length < 2) {
      return `<div class="empty"><span class="big">✂️</span>还没切开呢<br>在画布上按住拖一条线，划出第一刀吧</div>`;
    }
    if (!state.confirmed) {
      return `<div class="teaser"><span class="emoji">🍰</span><div>已经切成 <b>${state.pieces.length} 块</b>，一共 <b>${state.cuts.length} 刀</b>。<br>点「✓ 确认并展示数据」，看看每块的面积和周长。</div></div>`;
    }

    const infos = pieceInfos();
    const totalA = infos.reduce((s, x) => s + x.area, 0);
    const totalP = infos.reduce((s, x) => s + x.perim, 0);
    const seam = seamTotal();

    const rows = infos.map((x) => `
      <div class="prow">
        <span class="pname"><i class="swatch" style="background:${x.color}"></i><b>${numChar(x.i)}</b><em>${x.desc}</em></span>
        <span class="num">${measured(x.area, st.isCircle)}</span>
        <span class="num">${measured(x.perim, st.isCircle)}</span>
        <span class="num">${pct(x.area, totalA)}</span>
      </div>`).join('');

    const bar = infos.map((x) => `<i style="width:${((x.area / totalA) * 100).toFixed(3)}%;background:${x.color}"></i>`).join('');
    const deltaA = Math.abs(totalA - st.area);
    const deltaP = Math.abs(totalP - (st.perim + 2 * seam));
    const matchesArea = deltaA < 1e-8;
    const matchesPerim = deltaP < 1e-8;
    const modeledArea = matchesArea
      ? '✓ 与原面积相等'
      : st.isCircle ? '圆弧用短线段模拟，面积有近似误差。' : '和原面积相差 ' + measured(deltaA) + ' cm²';
    const modeledPerim = matchesPerim
      ? '✓ 与原周长加两倍刀痕总长相等'
      : st.isCircle ? '圆弧用短线段模拟，周长有近似误差。' : '和原周长加两倍刀痕总长相差 ' + measured(deltaP) + ' cm';

    return `
      <div class="ptable">
        <div class="prow head"><span>块</span><span class="num">面积/cm²</span><span class="num">周长/cm</span><span class="num">占比</span></div>
        ${rows}
        <div class="prow total"><span>合计</span><span class="num">${measured(totalA, st.isCircle)}</span><span class="num">${measured(totalP, st.isCircle)}</span><span class="num">100%</span></div>
      </div>
      <div class="share">${bar}</div>
      <div class="share-legend"><span>面积占比</span><span>共 ${infos.length} 块 · ${state.cuts.length} 刀</span></div>

      <div class="check">
        <b>总面积</b>
        <div>各块相加 <span class="val">${measured(totalA, st.isCircle)}</span> cm²<br>
        <span class="${matchesArea ? 'ok' : 'approx'}">${modeledArea}</span>
        <span style="color:#7C8A9E">（原面积 ${measured(st.area)} cm²）</span></div>
      </div>
      <div class="check">
        <b>各块周长之和</b>
        <div>各块相加 <span class="val">${measured(totalP, st.isCircle)}</span> cm<br>
        <span class="${matchesPerim ? 'ok' : 'approx'}">${modeledPerim}</span>
        <span style="color:#7C8A9E">（原周长 ${measured(st.perim)} cm · 刀痕总长 ${measured(seam, st.isCircle)} cm）</span></div>
      </div>
      <p class="takeaway">总计使用各块未舍入的数值。刀痕的两侧都计入各块周长之和。</p>
      ${$('#perimeterDemo').innerHTML}`;
  }

  /* ---------------- 切一刀（沿起终点之间的线段） ---------------- */
  function cutPlan(A, B) {
    if (state.cuts.length >= MAX_CUTS) {
      return { message: '已经切了 6 刀，可以先看看结果。' };
    }
    if (G.dist(A, B) < 0.3) return { message: '起点和终点要分开一点。' };

    const next = [];
    const gaps = [];
    let splits = 0, seamLen = 0;
    for (const pc of state.pieces) {
      const ring = worldPts(pc);
      const hits = segHits(ring, A, B);
      if (hits.length > 2) {
        const intervals = hits.slice(1).map((end, i) => ({
          start: hits[i], end, inside: insideInterval(ring, hits[i], end)
        }));
        const inside = intervals.filter((interval) => interval.inside);
        if (inside.length >= 2) {
          const first = inside[0].start.t, last = inside[inside.length - 1].end.t;
          gaps.push(...intervals.filter(({ start, end, inside }) => !inside && start.t >= first && end.t <= last));
        }
      }
      if (hits.length !== 2) { next.push(pc); continue; }

      const [P0, P1] = hits;
      const length = G.dist(P0, P1);
      const rings = length >= 0.25 && insideInterval(ring, P0, P1) ? splitRingAt(ring, P0, P1) : null;
      if (!rings) { next.push(pc); continue; }

      const circle = worldCircle(pc);
      splits++;
      seamLen += length;
      for (const pts of rings) {
        next.push({
          pts, m: idM(), fromCircle: pc.fromCircle, circle, lp: null,
          seams: [[P0, P1]], fresh: true, desc: describeRing(pts, circle)
        });
      }
    }

    if (gaps.length) return { gaps, message: '红色段经过图形外部。请在凹口两侧分别划刀。' };
    if (!splits) return { message: '这一刀切不开。请选择同一块边界上的两点，让刀线穿过图形内部。' };
    if (next.length > MAX_PIECES) return { message: '最多保留 12 块，可以先看看分割数据。' };
    return { next, seamLen };
  }

  function doCut(A, B) {
    if (state.confirmed) { toast('展示模式下先点「继续划刀」哦'); return; }
    const plan = cutPlan(A, B);
    if (!plan.next) { toast(plan.message); return; }

    state.cutStart = null;
    state.hoverBoundary = null;
    state.cursorWorld = null;
    state.history.push(snapshot());
    state.pieces = plan.next;
    state.cuts.push({ seams: [], seamLen: plan.seamLen, A, B });
    state.confirmed = false;
    state.sel = -1;
    state.corners = cornersOf(state.pieces);
    renderAll();
    flashSeams();
    if (state.pieces.length === 2) {
      toast('总面积不变，各块周长之和增加 ' + measured(2 * plan.seamLen, Boolean(state.meta.circle)) + ' cm');
    }
  }

  function snapshot() {
    return {
      pieces: state.pieces.map((p) => ({
        pts: p.pts, m: Object.assign({}, p.m), fromCircle: p.fromCircle, circle: p.circle,
        lp: p.lp, seams: p.seams, desc: p.desc
      })),
      cuts: state.cuts.map((c) => ({ seams: c.seams, seamLen: c.seamLen, A: c.A, B: c.B }))
    };
  }

  function flashSeams() {
    const layer = $('#piecesLayer');
    layer.classList.add('seam-flash');
    setTimeout(() => layer.classList.remove('seam-flash'), 820);
  }

  /* ---------------- 变换 ---------------- */
  function setMode(mode) {
    if (mode === 'resize' && (state.cuts.length > 0 || state.pieces.length > 1)) {
      toast('已经切开啦，想调整原图大小请先点「重来」');
      return;
    }
    if (mode === 'cut' && state.confirmed) state.confirmed = false;
    state.mode = mode;
    state.cutStart = null;
    state.hoverBoundary = null;
    state.cursorWorld = null;
    state.tdrag = null;
    state.snapSegs = null;
    state.hoverV = null;
    state.hoverKey = '';
    svg.style.cursor = '';
    if (mode !== 'move') state.sel = -1;
    renderAll();
  }

  function selectPiece(i) {
    state.sel = i;
    updateHead();
    renderPieces();
    renderSelection();
  }

  /* ---------- 顶点编辑：只改边长，不改图形类型 ---------- */
  function worldToLocal(pc, p) {
    const m = pc.m || idM();
    const det = m.a * m.d - m.b * m.c || 1;
    const dx = p.x - m.e, dy = p.y - m.f;
    return { x: (m.d * dx - m.c * dy) / det, y: (-m.b * dx + m.a * dy) / det };
  }

  function angleAt(a, b, c) {
    const ux = a.x - b.x, uy = a.y - b.y, vx = c.x - b.x, vy = c.y - b.y;
    const lu = Math.hypot(ux, uy) || 1, lv = Math.hypot(vx, vy) || 1;
    return (Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / (lu * lv)))) * 180) / Math.PI;
  }

  /* ---------- 网格吸附（1cm 一格） ---------- */
  const GRID = 1;
  function snapGridVal(v) {
    const r = Math.round(v / GRID) * GRID;
    return Math.abs(v - r) < 0.24 ? r : v;
  }
  function snapGridPoint(p) {
    return { x: snapGridVal(p.x), y: snapGridVal(p.y) };
  }
  /* 把接近水平 / 竖直的边拉到网格线上 */
  function snapAxisEdges(pts) {
    const out = pts.map((q) => ({ x: q.x, y: q.y }));
    const n = out.length;
    for (let i = 0; i < n; i++) {
      const a = out[i], b = out[(i + 1) % n];
      if (Math.abs(b.y - a.y) < 0.2) {
        const ny = snapGridVal((a.y + b.y) / 2);
        a.y = ny; b.y = ny;
      } else if (Math.abs(b.x - a.x) < 0.2) {
        const nx = snapGridVal((a.x + b.x) / 2);
        a.x = nx; b.x = nx;
      }
    }
    return out.map((q) => ({ x: q.x, y: q.y, corner: true }));
  }

  /* 鼠标附近的顶点 / 圆周点 */
  function nearestVertex(pc, worldP) {
    const wp = worldPts(pc);
    if (pc.fromCircle) {
      const b = G.bbox(wp);
      const c = { x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2 };
      const r = Math.min(b.w, b.h) / 2;
      const d = G.dist(worldP, c);
      if (Math.abs(d - r) < 0.5) {
        const ux = (worldP.x - c.x) / (d || 1), uy = (worldP.y - c.y) / (d || 1);
        return { i: -1, p: { x: c.x + ux * r, y: c.y + uy * r }, circle: true };
      }
      return null;
    }
    let best = null, bd = 0.45;
    for (let i = 0; i < wp.length; i++) {
      const d = G.dist(wp[i], worldP);
      if (d < bd) { bd = d; best = { i, p: { x: wp[i].x, y: wp[i].y } }; }
    }
    return best;
  }

  /* 按类型改形：目标点 t（局部坐标） */
  function editVertex(kind, pts, i, t, isCircle) {
    const n = pts.length;
    const c = G.polyCentroid(pts);
    const out = (arr) => arr.map((q) => ({ x: q.x, y: q.y, corner: true }));

    if (isCircle || kind === 'circle') {
      const r = Math.max(0.6, Math.min(5.2, G.dist(t, c)));
      return G.circlePoints(c.x, c.y, r, 360);
    }

    const uniform = () => {
      const v = pts[i] || c;
      const d0 = Math.max(0.08, G.dist(v, c));
      const k = Math.max(0.3, Math.min(2.6, G.dist(t, c) / d0));
      return out(pts.map((q) => ({ x: c.x + (q.x - c.x) * k, y: c.y + (q.y - c.y) * k })));
    };

    if (kind === 'rect') {
      const b = G.bbox(pts);
      const opp = { x: b.x0 + b.x1 - pts[i].x, y: b.y0 + b.y1 - pts[i].y };
      const x0 = Math.min(opp.x, t.x), x1 = Math.max(opp.x, t.x);
      const y0 = Math.min(opp.y, t.y), y1 = Math.max(opp.y, t.y);
      if (x1 - x0 < 0.5 || y1 - y0 < 0.5) return null;
      return out([{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }]);
    }

    if (kind === 'isosceles') {
      let apex = 0;
      for (let k = 1; k < n; k++) if (pts[k].y < pts[apex].y) apex = k;
      const others = [0, 1, 2].filter((k) => k !== apex);
      const axisX = pts[apex].x;
      const baseY = (pts[others[0]].y + pts[others[1]].y) / 2;
      let half = Math.abs(pts[others[0]].x - axisX);
      let apexY = pts[apex].y;
      if (i === apex) apexY = Math.min(t.y, baseY - 0.5);
      else half = Math.max(0.35, Math.abs(t.x - axisX));
      return out([{ x: axisX, y: apexY }, { x: axisX + half, y: baseY }, { x: axisX - half, y: baseY }]);
    }

    if (kind === 'right') {
      let ri = 0;
      for (let k = 1; k < n; k++) {
        if (Math.abs(angleAt(pts[(k - 1 + n) % n], pts[k], pts[(k + 1) % n]) - 90) <
            Math.abs(angleAt(pts[(ri - 1 + n) % n], pts[ri], pts[(ri + 1) % n]) - 90)) ri = k;
      }
      if (i === ri) {
        const dx = t.x - pts[i].x, dy = t.y - pts[i].y;
        return out(pts.map((q) => ({ x: q.x + dx, y: q.y + dy })));
      }
      const p0 = pts[ri], v = pts[i];
      const ux = v.x - p0.x, uy = v.y - p0.y;
      const L = Math.hypot(ux, uy) || 1;
      const proj = Math.max(0.4, ((t.x - p0.x) * ux + (t.y - p0.y) * uy) / L);
      const np = { x: p0.x + (ux / L) * proj, y: p0.y + (uy / L) * proj };
      return out(pts.map((q, k) => (k === i ? np : { x: q.x, y: q.y })));
    }

    if (kind === 'parallelogram') {
      const opp = (i + 2) % n;
      const dx = t.x - pts[i].x, dy = t.y - pts[i].y;
      return out(pts.map((q, k) => {
        if (k === i) return { x: q.x + dx, y: q.y + dy };
        if (k === opp) return { x: q.x - dx, y: q.y - dy };
        return { x: q.x, y: q.y };
      }));
    }

    if (kind === 'rhombus') {
      const v = pts[i];
      const ux = v.x - c.x, uy = v.y - c.y;
      const L = Math.hypot(ux, uy) || 1;
      const proj = Math.max(0.35, ((t.x - c.x) * ux + (t.y - c.y) * uy) / L);
      const np = { x: c.x + (ux / L) * proj, y: c.y + (uy / L) * proj };
      const opp = (i + 2) % n;
      return out(pts.map((q, k) => {
        if (k === i) return np;
        if (k === opp) return { x: 2 * c.x - np.x, y: 2 * c.y - np.y };
        return { x: q.x, y: q.y };
      }));
    }

    if (kind === 'trapezoid') {
      /* 同一条底上的另一个点（用来保持两底水平、限制底长） */
      let partner = -1;
      for (let k = 0; k < n; k++) {
        if (k === i) continue;
        if (Math.abs(pts[k].y - pts[i].y) < 0.3) { partner = k; break; }
      }
      /* 另一条底边的 y */
      let otherY = null;
      for (let k = 0; k < n; k++) {
        if (Math.abs(pts[k].y - pts[i].y) > 0.3) { otherY = pts[k].y; break; }
      }
      /* 竖直：整条底边一起上下移动 → 改变高 */
      let dy = t.y - pts[i].y;
      if (otherY !== null) {
        if (otherY > pts[i].y) dy = Math.min(dy, otherY - pts[i].y - 0.6); /* 当前是上底 */
        else dy = Math.max(dy, otherY - pts[i].y + 0.6); /* 当前是下底 */
      }
      /* 水平：只动这个点 → 改变底长，且不越过同一个底上的另一个点 */
      let nx = t.x;
      if (partner >= 0) {
        if (pts[partner].x < pts[i].x) nx = Math.max(nx, pts[partner].x + 0.3);
        else nx = Math.min(nx, pts[partner].x - 0.3);
      }
      return out(pts.map((q, k) => {
        if (k === i) return { x: nx, y: q.y + dy };
        if (k === partner) return { x: q.x, y: q.y + dy };
        return { x: q.x, y: q.y };
      }));
    }

    if (kind === 'isoTrapezoid') {
      const b = G.bbox(pts);
      const axisX = c.x;
      let halfTop = 0, halfBot = 0;
      for (const q of pts) {
        if (Math.abs(q.y - b.y0) < 0.2) halfTop = Math.max(halfTop, Math.abs(q.x - axisX));
        if (Math.abs(q.y - b.y1) < 0.2) halfBot = Math.max(halfBot, Math.abs(q.x - axisX));
      }
      const isTop = Math.abs(pts[i].y - b.y0) < 0.3;
      const half = Math.max(0.4, Math.abs(t.x - axisX));
      let topY = b.y0, botY = b.y1;
      if (isTop) { topY = Math.min(t.y, botY - 0.6); halfTop = half; }
      else { botY = Math.max(t.y, topY + 0.6); halfBot = half; }
      return out([
        { x: axisX - halfTop, y: topY }, { x: axisX + halfTop, y: topY },
        { x: axisX + halfBot, y: botY }, { x: axisX - halfBot, y: botY }
      ]);
    }

    if (kind === 'rightTrapezoid') {
      const b = G.bbox(pts);
      const leftX = b.x0, topY = b.y0, botY = b.y1;
      const isTop = Math.abs(pts[i].y - topY) < 0.25;
      /* 竖直：整条横边一起移动 → 改高 */
      let dy = t.y - pts[i].y;
      if (isTop) dy = Math.min(dy, botY - topY - 0.6);
      else dy = Math.max(dy, topY - botY + 0.6);
      /* 水平：右边两个点可以改底长，左边的点保持竖直不动 */
      let nx = pts[i].x;
      if (Math.abs(pts[i].x - leftX) > 0.25) nx = Math.max(leftX + 0.4, t.x);
      const moved = pts.map((q) => (Math.abs(q.y - (isTop ? topY : botY)) < 0.25 ? { x: q.x, y: q.y + dy } : { x: q.x, y: q.y }));
      return out(moved.map((q, k) => (k === i ? { x: nx, y: q.y } : q)));
    }

    if (kind === 'polygon') {
      return out(pts.map((q, k) => (k === i ? { x: t.x, y: t.y } : { x: q.x, y: q.y })));
    }

    if (kind === 'concave') {
      /* 凹形（L 形 / 星形）：横竖分别缩放 → 可以改长宽，形状特征不变 */
      const v = pts[i] || c;
      const b = G.bbox(pts);
      const halfW = Math.max(0.3, (b.x1 - b.x0) / 2);
      const halfH = Math.max(0.3, (b.y1 - b.y0) / 2);
      let kx = Math.abs(v.x - c.x) > 0.25 ? (t.x - c.x) / (v.x - c.x) : 1 + (t.x - v.x) / halfW;
      let ky = Math.abs(v.y - c.y) > 0.25 ? (t.y - c.y) / (v.y - c.y) : 1 + (t.y - v.y) / halfH;
      kx = Math.max(0.25, Math.min(3, kx));
      ky = Math.max(0.25, Math.min(3, ky));
      return out(pts.map((q) => ({ x: c.x + (q.x - c.x) * kx, y: c.y + (q.y - c.y) * ky })));
    }

    return uniform();
  }

  function onDownVertex(evt) {
    const pc = state.pieces[0];
    if (!pc) return;
    const p = toWorld(evt);
    const h = nearestVertex(pc, p);
    if (!h) { toast('把鼠标移到顶点（或圆周）附近再拖'); return; }
    state.tdrag = { type: 'vertex', i: h.i, circle: !!h.circle, base: pc.pts };
    state.hoverV = h.p;
    svg.style.cursor = 'grabbing';
    evt.preventDefault();
  }

  /* ---------- 边吸附 / 角吸附 ---------- */
  function edgesOf(pts, minLen) {
    const out = [];
    const n = pts.length;
    const lim = minLen === undefined ? 0.35 : minLen;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d < lim) continue;
      out.push({ i, a, b, d, ux: dx / d, uy: dy / d });
    }
    return out;
  }

  /* 真正的“角点”：内角明显不是 180° */
  function cornersOfPts(pts) {
    const n = pts.length;
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
      const ux = a.x - b.x, uy = a.y - b.y, vx = c.x - b.x, vy = c.y - b.y;
      const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
      if (lu < 0.08 || lv < 0.08) continue;
      const ang = Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / (lu * lv))));
      if (Math.abs(ang - Math.PI) < 0.21) continue;
      out.push({ i, x: b.x, y: b.y, ang, ux: ux / lu, uy: uy / lu, vx: vx / lv, vy: vy / lv });
    }
    return out;
  }

  /* 试探性检查：这个位置会不会和某块重叠（贴边不算） */
  function overlapsPts(wp, targetPts) {
    for (let i = 0; i < wp.length; i += 1) {
      const p = wp[i];
      if (G.distToBoundary(targetPts, p) < 0.02) continue;
      if (G.pointInPoly(targetPts, p)) return true;
    }
    return false;
  }

  /* 单边磁吸：只纠正“垂直距离 + 角度”，沿着边走的位置保留 → 可以贴着边滑 */
  function findEdgeSnap(pc, idx, m) {
    const wp = G.transformPts(pc.pts, m);
    const cw = G.polyCentroid(wp);
    const E0 = edgesOf(wp);
    if (!E0.length) return null;
    const b0 = G.bbox(wp);
    let best = null;
    for (let j = 0; j < state.pieces.length; j++) {
      if (j === idx) continue;
      const op = state.pieces[j];
      const ow = G.transformPts(op.pts, op.m);
      const b1 = G.bbox(ow);
      if (b0.x1 < b1.x0 - 0.8 || b0.x0 > b1.x1 + 0.8 || b0.y1 < b1.y0 - 0.8 || b0.y0 > b1.y1 + 0.8) continue;
      const E1 = edgesOf(ow);
      for (const ea of E0) {
        const mx0 = (ea.a.x + ea.b.x) / 2, my0 = (ea.a.y + ea.b.y) / 2;
        for (const eb of E1) {
          const cross = ea.ux * eb.uy - ea.uy * eb.ux;
          const dot = ea.ux * eb.ux + ea.uy * eb.uy;
          let ang = Math.atan2(cross, dot);
          if (ang > Math.PI / 2) ang -= Math.PI;
          if (ang < -Math.PI / 2) ang += Math.PI;
          if (Math.abs(ang) > 0.2) continue;
          const cos = Math.cos(ang), sin = Math.sin(ang);
          const dx = mx0 - cw.x, dy = my0 - cw.y;
          const mx = cw.x + dx * cos - dy * sin;
          const my = cw.y + dx * sin + dy * cos;
          const nx = -eb.uy, ny = eb.ux;
          const s = (mx - eb.a.x) * nx + (my - eb.a.y) * ny;
          if (Math.abs(s) > 0.42) continue;
          const p0 = (ea.a.x - eb.a.x) * eb.ux + (ea.a.y - eb.a.y) * eb.uy;
          const p1 = (ea.b.x - eb.a.x) * eb.ux + (ea.b.y - eb.a.y) * eb.uy;
          const lo = Math.min(p0, p1), hi = Math.max(p0, p1);
          const ov = Math.min(hi, eb.d) - Math.max(lo, 0);
          if (ov < Math.min(0.45, 0.35 * Math.min(ea.d, eb.d))) continue;
          const oc = G.polyCentroid(ow);
          const sTarget = (oc.x - eb.a.x) * nx + (oc.y - eb.a.y) * ny;
          const sDrag = (cw.x - eb.a.x) * nx + (cw.y - eb.a.y) * ny;
          if (sTarget * sDrag > 0) continue; /* 两块重心同侧 → 贴上去会重叠 */
          const score = Math.abs(s) + Math.abs(ang) * 0.5;
          if (!best || score < best.score) {
            best = {
              score,
              m: mulM(transM(-s * nx, -s * ny), mulM(rotAbout(cw.x, cw.y, ang), m)),
              segs: [[eb.a, eb.b]],
              other: ow
            };
          }
        }
      }
    }
    if (!best) return null;
    if (overlapsPts(G.transformPts(pc.pts, best.m), best.other)) return null;
    return best;
  }

  /* 角吸附：两条邻边同时对齐，直接坐进那个角 */
  function findCornerSnap(pc, idx, m) {
    const wp = G.transformPts(pc.pts, m);
    const cw = G.polyCentroid(wp);
    const CA = cornersOfPts(wp);
    if (!CA.length) return null;
    const b0 = G.bbox(wp);
    let best = null;
    for (let j = 0; j < state.pieces.length; j++) {
      if (j === idx) continue;
      const op = state.pieces[j];
      const ow = G.transformPts(op.pts, op.m);
      const b1 = G.bbox(ow);
      if (b0.x1 < b1.x0 - 0.8 || b0.x0 > b1.x1 + 0.8 || b0.y1 < b1.y0 - 0.8 || b0.y0 > b1.y1 + 0.8) continue;
      const CB = cornersOfPts(ow);
      if (!CB.length) continue;
      const n = wp.length;
      for (const ca of CA) {
        for (const cb of CB) {
          /* 两角相等（同一扇形）或互补（两扇形合成平角）都可能拼合 */
          const dEq = Math.abs(ca.ang - cb.ang);
          const dSup = Math.abs(ca.ang + cb.ang - Math.PI);
          if (Math.min(dEq, dSup) > 0.16) continue;
          for (const swap of [false, true]) {
            const bx = swap ? cb.vx : cb.ux, by = swap ? cb.vy : cb.uy;
            const ang = Math.atan2(ca.ux * by - ca.uy * bx, ca.ux * bx + ca.uy * by);
            if (Math.abs(ang) > 0.26) continue;
            const cos = Math.cos(ang), sin = Math.sin(ang);
            const dx = ca.x - cw.x, dy = ca.y - cw.y;
            const vx = cw.x + dx * cos - dy * sin;
            const vy = cw.y + dx * sin + dy * cos;
            const tx = cb.x - vx, ty = cb.y - vy;
            const dist = Math.hypot(tx, ty);
            if (dist > 0.5) continue;
            const m2 = mulM(transM(tx, ty), mulM(rotAbout(cw.x, cw.y, ang), m));
            const wp2 = G.transformPts(pc.pts, m2);
            const e1x = wp2[(ca.i + 1) % n].x - wp2[ca.i].x, e1y = wp2[(ca.i + 1) % n].y - wp2[ca.i].y;
            const e2x = wp2[(ca.i - 1 + n) % n].x - wp2[ca.i].x, e2y = wp2[(ca.i - 1 + n) % n].y - wp2[ca.i].y;
            const l1 = Math.hypot(e1x, e1y), l2 = Math.hypot(e2x, e2y);
            if (l1 < 0.08 || l2 < 0.08) continue;
            const par = (ex, ey, fx, fy, len) => Math.abs(ex * fy - ey * fx) / ((len * Math.hypot(fx, fy)) || 1);
            const p1 = Math.min(par(e1x, e1y, cb.ux, cb.uy, l1), par(e1x, e1y, cb.vx, cb.vy, l1));
            const p2 = Math.min(par(e2x, e2y, cb.ux, cb.uy, l2), par(e2x, e2y, cb.vx, cb.vy, l2));
            if (p1 > 0.16 || p2 > 0.16) continue;
            if (overlapsPts(wp2, ow)) continue;
            const score = dist + Math.abs(ang) * 0.6;
            if (!best || score < best.score) {
              best = {
                score, m: m2,
                segs: [
                  [ow[cb.i], ow[(cb.i + 1) % ow.length]],
                  [ow[cb.i], ow[(cb.i - 1 + ow.length) % ow.length]]
                ]
              };
            }
          }
        }
      }
    }
    return best;
  }

  function findSnap(pc, idx, m) {
    const corner = findCornerSnap(pc, idx, m);
    if (corner) return corner;
    return findEdgeSnap(pc, idx, m);
  }

  function transformSel(act) {
    if (act === 'resetall') {
      state.pieces.forEach((p) => { p.m = idM(); });
      state.corners = cornersOf(state.pieces);
      renderAll();
      toast('所有小块都回到了原来的位置');
      return;
    }
    const i = state.sel;
    if (i < 0) { toast('先点一下要变换的小块'); return; }
    const pc = state.pieces[i];
    if (act === 'resett') {
      pc.m = idM();
      renderAll();
      toast('这一块回到了原位');
      return;
    }
    const c = G.polyCentroid(worldPts(pc));
    if (act === 'rotl') pc.m = mulM(rotAbout(c.x, c.y, -15 * Math.PI / 180), pc.m);
    else if (act === 'rotr') pc.m = mulM(rotAbout(c.x, c.y, 15 * Math.PI / 180), pc.m);
    else if (act === 'flipx') pc.m = mulM(scaleAbout(c.x, c.y, -1, 1), pc.m);
    else if (act === 'flipy') pc.m = mulM(scaleAbout(c.x, c.y, 1, -1), pc.m);
    state.corners = cornersOf(state.pieces);
    renderAll();
  }

  /* ---------------- 指针 ---------------- */
  const svg = $('#stage');
  let touchEnabled = false;

  $('#touchModeBtn').addEventListener('click', (event) => {
    touchEnabled = !touchEnabled;
    $('#stageWrap').classList.toggle('touch-enabled', touchEnabled);
    event.currentTarget.setAttribute('aria-pressed', String(touchEnabled));
    event.currentTarget.textContent = touchEnabled ? '完成操作' : '操作画布';
    $('#touchHelp').textContent = touchEnabled
      ? '已开启触摸编辑，可在画布里点选或拖动。'
      : '默认可从画布上滑动页面。';
  });

  const compactLayout = matchMedia('(max-width: 900px)');
  function placeShapeCard() {
    const parent = compactLayout.matches ? $('.layout') : $('#dataPanel');
    parent.prepend($('#shapeCard'));
  }
  compactLayout.addEventListener('change', placeShapeCard);
  placeShapeCard();

  function toWorld(evt) {
    const rect = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const scale = Math.min(rect.width / vb.width, rect.height / vb.height);
    const ox = (rect.width - vb.width * scale) / 2;
    const oy = (rect.height - vb.height * scale) / 2;
    return { x: (evt.clientX - rect.left - ox) / scale, y: (evt.clientY - rect.top - oy) / scale };
  }

  function pieceAt(p) {
    if (state.sel >= 0) {
      const pc = state.pieces[state.sel];
      if (pc && G.pointInPoly(worldPts(pc), p)) return state.sel;
    }
    for (let i = state.pieces.length - 1; i >= 0; i--) {
      if (G.pointInPoly(worldPts(state.pieces[i]), p)) return i;
    }
    return -1;
  }

  /* ---------- 边界吸附 & 线段切割 ---------- */
  function nearestBoundary(p, maxD) {
    let best = null, bd = maxD;
    for (const pc of state.pieces) {
      const pts = worldPts(pc);
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const a = pts[i], b = pts[(i + 1) % n];
        const dx = b.x - a.x, dy = b.y - a.y;
        const l2 = dx * dx + dy * dy;
        if (l2 < 1e-12) continue;
        let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2;
        t = Math.max(0, Math.min(1, t));
        const qx = a.x + t * dx, qy = a.y + t * dy;
        const d = Math.hypot(p.x - qx, p.y - qy);
        if (d < bd) { bd = d; best = { x: qx, y: qy }; }
      }
    }
    return best;
  }

  /* 线段与多边形边界的交点，按沿线段位置排序去重 */
  function segHits(pts, A, B) {
    const n = pts.length;
    const rx = B.x - A.x, ry = B.y - A.y;
    const out = [];
    for (let i = 0; i < n; i++) {
      const p0 = pts[i], p1 = pts[(i + 1) % n];
      const sx = p1.x - p0.x, sy = p1.y - p0.y;
      const den = rx * sy - ry * sx;
      if (Math.abs(den) < 1e-12) continue;
      const t = ((p0.x - A.x) * sy - (p0.y - A.y) * sx) / den;
      const u = ((p0.x - A.x) * ry - (p0.y - A.y) * rx) / den;
      if (t < -1e-9 || t > 1 + 1e-9) continue;
      if (u < -1e-9 || u > 1 + 1e-9) continue;
      const endpoint = u <= 1e-8 ? p0 : u >= 1 - 1e-8 ? p1 : null;
      const arc = arcEdge(p0, p1);
      const arcEdges = endpoint ? endpoint.arcEdges : arc === undefined ? null : [arc];
      const metadata = arcEdges ? { onCircle: true, arcEdges } : {};
      out.push({
        ...metadata,
        t: Math.max(0, Math.min(1, t)),
        x: A.x + t * rx, y: A.y + t * ry
      });
    }
    out.sort((a, b) => a.t - b.t);
    const ded = [];
    for (const h of out) {
      if (!ded.length || Math.abs(h.t - ded[ded.length - 1].t) > 1e-6) ded.push(h);
    }
    return ded;
  }

  // 相邻交点之间没有新的交点，取中点即可区分内部与外部。
  function insideInterval(pts, A, B) {
    const midpoint = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    return G.distToBoundary(pts, midpoint) > 1e-7 && G.pointInPoly(pts, midpoint);
  }

  function locateOnRing(pts, p) {
    const n = pts.length;
    let best = null, bd = 1e-5;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const dx = b.x - a.x, dy = b.y - a.y;
      const l2 = dx * dx + dy * dy;
      if (l2 < 1e-12) continue;
      let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2;
      t = Math.max(0, Math.min(1, t));
      const qx = a.x + t * dx, qy = a.y + t * dy;
      const d = Math.hypot(p.x - qx, p.y - qy);
      if (d < bd) { bd = d; best = { e: i, t }; }
    }
    return best;
  }

  function walkRing(pts, fromE, toE, toT) {
    const n = pts.length;
    const out = [];
    let k = (fromE + 1) % n;
    let guard = 0;
    while (k !== toE && guard++ <= n + 1) {
      out.push(pts[k]);
      k = (k + 1) % n;
    }
    if (k !== toE) return null;
    if (toT > 1e-9) out.push(pts[toE]);
    return out;
  }

  function dedupeRing(arr) {
    const out = [];
    for (const q of arr) {
      const p = out[out.length - 1];
      if (!p || Math.hypot(q.x - p.x, q.y - p.y) > 1e-9) out.push(q);
    }
    if (out.length > 2) {
      const a = out[0], b = out[out.length - 1];
      if (Math.hypot(a.x - b.x, a.y - b.y) < 1e-9) out.pop();
    }
    return out;
  }

  /* 用弦 A—B 把多边形切成两块 */
  function splitRingAt(pts, A, B) {
    const la = locateOnRing(pts, A), lb = locateOnRing(pts, B);
    if (!la || !lb) return null;
    if (la.e === lb.e) return null;
    const chainAB = walkRing(pts, la.e, lb.e, lb.t);
    const chainBA = walkRing(pts, lb.e, la.e, la.t);
    if (!chainAB || !chainBA) return null;
    const r1 = dedupeRing([A].concat(chainAB, [B]));
    const r2 = dedupeRing([B].concat(chainBA, [A]));
    if (r1.length < 3 || r2.length < 3) return null;
    if (Math.abs(G.polyArea(r1)) < 0.01 || Math.abs(G.polyArea(r2)) < 0.01) return null;
    return [r1, r2];
  }

  function onDown(evt) {
    if (evt.pointerType === 'touch' && !touchEnabled) return;
    if (evt.button !== undefined && evt.button !== 0) return;
    try { svg.setPointerCapture(evt.pointerId); } catch (err) { /* 合成事件忽略 */ }
    if (state.mode === 'resize') { onDownVertex(evt); return; }
    if (state.mode === 'move') { onDownMove(evt); return; }
    if (state.confirmed) { toast('展示模式下先点「继续划刀」哦'); return; }
    const p = toWorld(evt);
    const bp = nearestBoundary(p, 0.9);
    evt.preventDefault();
    if (!state.cutStart) {
      if (!bp) { toast('请点在图形边界上，作为起点'); return; }
      state.cutStart = { x: bp.x, y: bp.y };
      state.hoverBoundary = bp;
      state.cursorWorld = p;
      updateHead();
      renderPreview();
      return;
    }
    if (!bp) { toast('终点也要落在图形边界上'); return; }
    if (G.dist(state.cutStart, bp) < 0.3) { toast('起点和终点要分开一点'); return; }
    state.hoverBoundary = bp;
    state.cursorWorld = p;
    doCut(state.cutStart, bp);
    if (state.cutStart) renderPreview();
  }

  function onDownMove(evt) {
    const p = toWorld(evt);
    const i0 = state.sel;
    if (i0 >= 0 && state.pieces[i0]) {
      const h = handlePos(state.pieces[i0]);
      if (G.dist(h, p) < 0.34) {
        const pc = state.pieces[i0];
        const c = G.polyCentroid(worldPts(pc));
        state.tdrag = {
          type: 'rotate', i: i0, center: c, m0: Object.assign({}, pc.m),
          a0: Math.atan2(p.y - c.y, p.x - c.x)
        };
        return;
      }
    }
    const i = pieceAt(p);
    if (i < 0) {
      state.sel = -1;
      updateHead();
      renderPieces();
      renderSelection();
      return;
    }
    state.sel = i;
    state.tdrag = { type: 'move', i, start: p, m0: Object.assign({}, state.pieces[i].m) };
    updateHead();
    renderPieces();
    renderSelection();
    renderMarks();
    evt.preventDefault();
  }

  function syncPieceDOM(i) {
    const pc = state.pieces[i];
    if (!pc) return;
    const g = $('#piecesLayer g[data-i="' + i + '"]');
    if (g) g.setAttribute('transform', matStr(pc.m));
    const fg = document.getElementById('faceG');
    if (fg && state.pieces.length === 1) fg.setAttribute('transform', matStr(pc.m));
    if (!pc.lp || !pc._off) return;
    const p = G.applyM(pc.m, pc.lp);
    const num = document.getElementById('num-' + i);
    if (num) {
      num.setAttribute('x', p.x.toFixed(3));
      num.setAttribute('y', (p.y + pc._off.ny).toFixed(3));
    }
    const ar = document.getElementById('area-' + i);
    if (ar) {
      ar.setAttribute('x', p.x.toFixed(3));
      ar.setAttribute('y', (p.y + pc._off.ay).toFixed(3));
    }
  }

  function onMove(evt) {
    if (evt.pointerType === 'touch' && !touchEnabled) return;
    if (state.tdrag) {
      const td = state.tdrag;
      const pi = td.type === 'vertex' ? 0 : td.i;
      const pc = state.pieces[pi];
      const p = toWorld(evt);
      if (td.type === 'move') {
        let dx = p.x - td.start.x, dy = p.y - td.start.y;
        let m = mulM(transM(dx, dy), td.m0);
        const b = G.bbox(G.transformPts(pc.pts, m));
        const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
        if (cx < 0.4) dx += 0.4 - cx; else if (cx > W - 0.4) dx -= cx - (W - 0.4);
        if (cy < 0.4) dy += 0.4 - cy; else if (cy > H - 0.4) dy -= cy - (H - 0.4);
        m = mulM(transM(dx, dy), td.m0);
        const sn = findSnap(pc, td.i, m);
        state.snapSegs = sn ? sn.segs : null;
        pc.m = sn ? sn.m : m;
      } else if (td.type === 'vertex') {
        let lp = worldToLocal(pc, p);
        if (state.showGrid) lp = snapGridPoint(lp);
        let next = editVertex(state.realKind, td.base, td.i, lp, td.circle);
        if (next && state.showGrid && state.realKind !== 'circle' && !td.circle) next = snapAxisEdges(next);
        if (next) {
          pc.pts = next;
          pc.lp = null;
          state.poly0 = next;
          if (pc.fromCircle) {
            const b = G.bbox(next);
            pc.circle = { cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, r: b.w / 2 };
            state.meta.circle = pc.circle;
          }
          state.corners = cornersOf(state.pieces);
          state.hoverV = null;
          state.hoverKey = '';
          renderAll();
          svg.style.cursor = 'grabbing';
          evt.preventDefault();
          return;
        }
      } else {
        const ang = Math.atan2(p.y - td.center.y, p.x - td.center.x);
        let delta = ang - td.a0;
        const step = Math.PI / 12;
        const snapped = Math.round(delta / step) * step;
        if (Math.abs(delta - snapped) < 0.04) delta = snapped;
        pc.m = mulM(rotAbout(td.center.x, td.center.y, delta), td.m0);
      }
      syncPieceDOM(td.i);
      renderSelection();
      evt.preventDefault();
      return;
    }
    if (state.mode === 'resize') {
      const pc0 = state.pieces[0];
      if (pc0) {
        const h = nearestVertex(pc0, toWorld(evt));
        const key = h ? h.i + '@' + h.p.x.toFixed(2) + ',' + h.p.y.toFixed(2) : '';
        if (key !== state.hoverKey) {
          state.hoverKey = key;
          state.hoverV = h ? h.p : null;
          svg.style.cursor = h ? 'grab' : '';
          renderSelection();
        }
      }
      return;
    }
    if (state.mode === 'cut') {
      const p = toWorld(evt);
      const bp = nearestBoundary(p, 0.9);
      state.cursorWorld = p;
      state.hoverBoundary = bp;
      renderPreview();
      return;
    }
  }

  function onUp() {
    if (state.tdrag) {
      const td = state.tdrag;
      state.tdrag = null;
      state.snapSegs = null;
      if (td.type === 'vertex') {
        const pc0 = state.pieces[0];
        if (pc0) {
          pc0.lp = null;
          state.poly0 = pc0.pts;
          pc0.desc = pc0.fromCircle ? '圆形' : G.classifyShape(pc0.pts);
        }
      }
      state.corners = cornersOf(state.pieces);
      state.hoverV = null;
      state.hoverKey = '';
      renderAll();
      svg.style.cursor = '';
      return;
    }
  }

  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.cutStart) {
      state.cutStart = null;
      state.hoverBoundary = null;
      state.cursorWorld = null;
      updateHead();
      renderPreview();
    }
  });
  window.addEventListener('pointercancel', () => {
    state.tdrag = null; renderPreview();
  });

  /* ---------------- 按钮 ---------------- */
  function undo() {
    if (!state.history.length) { toast('还没有可以撤销的刀哦'); return; }
    const prev = state.history.pop();
    state.pieces = prev.pieces.map((p) => Object.assign({}, p, { m: Object.assign({}, p.m) }));
    state.cuts = prev.cuts;
    state.confirmed = false;
    state.sel = -1;
    state.corners = cornersOf(state.pieces);
    renderAll();
    toast('撤掉了一刀');
  }

  function resetAll() {
    state.pieces = [{
      pts: state.poly0, m: idM(), fromCircle: state.realKind === 'circle', circle: state.meta.circle || null,
      lp: null, seams: [], desc: state.meta.circle ? '圆形' : G.classifyShape(state.poly0)
    }];
    state.cuts = [];
    state.history = [];
    state.confirmed = false;
    state.sel = -1;
    state.corners = cornersOf(state.pieces);
    renderAll();
    toast('重新开始，试试新的刀法～');
  }

  function onConfirm() {
    if (state.confirmed) {
      state.confirmed = false;
      setMode('cut');
      toast('可以接着划刀啦');
      return;
    }
    if (state.pieces.length < 2) {
      toast('先划一刀，把图形切开才能看数据');
      pulseStage();
      return;
    }
    state.confirmed = true;
    setMode('move');
    toast('数据算好啦，可以拖开小块、转一转、翻个面');
  }

  function pulseStage() {
    const el = $('#stageWrap');
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.012)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
  }

  /* ---------------- 提示 ---------------- */
  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ---------------- 绑定 ---------------- */
  $('#shapeSelect').addEventListener('change', (e) => {
    buildShape(e.target.value);
  });
  $('#shapeN').addEventListener('change', (e) => {
    const lower = Number(e.target.min), upper = Number(e.target.max);
    const value = parseInt(e.target.value, 10) || 6;
    state.ngon = clamp(value, lower, upper);
    if (value !== state.ngon) toast('可输入 ' + lower + '–' + upper + ($('#shapeCountLabel').textContent === '角数' ? ' 角' : ' 边'));
    e.target.value = state.ngon;
    if (['regular', 'star', 'polygon'].indexOf(state.realKind) >= 0) {
      buildShape(state.realKind);
    }
  });
  $('#angleToggle').addEventListener('change', (e) => {
    state.showAngles = e.target.checked;
    renderPieces();
    if (state.showAngles) toast('只标出还完整保留的原图形的角');
  });
  $('#rerollBtn').addEventListener('click', () => buildShape(state.kind));
  $('#resetBtn').addEventListener('click', resetAll);
  $('#undoBtn').addEventListener('click', undo);
  $('#confirmBtn').addEventListener('click', onConfirm);
  $('#gridToggle').addEventListener('change', (e) => {
    state.showGrid = e.target.checked;
    $('#gridRect').style.display = state.showGrid ? '' : 'none';
    updateHead();
  });
  $('#modeSwitch').addEventListener('click', (e) => {
    const b = e.target.closest('.mode-btn');
    if (!b || b.dataset.mode === state.mode) return;
    setMode(b.dataset.mode);
    if (b.dataset.mode === 'move' && state.pieces.length < 2) toast('先划一刀，再来拼摆小块');
  });
  $('#mbTools').addEventListener('click', (e) => {
    const b = e.target.closest('.tbtn');
    if (!b) return;
    transformSel(b.dataset.act);
  });

  /* ---------------- 启动 ---------------- */
  buildShape('random');
})();
</script>
</body>
</html>
