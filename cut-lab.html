<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>切图实验室-零与整</title>
<style>/* ================= 基础 ================= */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  color: #22324F;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(900px 520px at 8% -12%, #FFFAEC 0%, rgba(255, 250, 236, 0) 62%),
    radial-gradient(760px 460px at 102% -4%, #FBEFD6 0%, rgba(251, 239, 214, 0) 58%),
    radial-gradient(900px 700px at 50% 120%, #F3E7CE 0%, rgba(243, 231, 206, 0) 60%),
    #F6EFDF;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
  background-image:
    repeating-linear-gradient(0deg, rgba(31, 46, 74, .028) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(31, 46, 74, .022) 0 1px, transparent 1px 6px);
}
.app { position: relative; z-index: 1; }

/* ================= 顶部 ================= */
.top {
  max-width: 1300px;
  margin: 0 auto;
  padding: 24px 30px 4px;
  display: flex;
  gap: 24px;
  align-items: flex-start;
  justify-content: space-between;
}
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .16em;
  color: #8A6A24;
  background: #FBEBC6;
  border: 1.5px solid #E3C47A;
  border-radius: 999px;
  padding: 4px 12px;
}
.kicker::before { content: "✂"; font-size: 12px; }
h1 {
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
  font-size: clamp(28px, 3.1vw, 40px);
  line-height: 1.16;
  margin: 10px 0 6px;
  letter-spacing: .02em;
  font-weight: 700;
}
h1 .hl {
  position: relative;
  display: inline-block;
  padding: 0 4px;
}
h1 .hl::after {
  content: "";
  position: absolute;
  left: -2px; right: -2px; bottom: 2px;
  height: 12px;
  background: linear-gradient(90deg, rgba(232, 178, 63, .55), rgba(232, 178, 63, .18));
  border-radius: 6px;
  z-index: -1;
  transform: rotate(-1deg);
}
h1 small {
  font-family: "Songti SC", "STSong", serif;
  font-size: .46em;
  font-weight: 500;
  color: #7D8AA3;
  letter-spacing: .04em;
  margin-left: 6px;
}
.sub {
  margin: 0;
  color: #5E6E8C;
  font-size: 14px;
  line-height: 1.7;
  max-width: 620px;
}
.mascot-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  padding-top: 6px;
}
.bubble {
  position: relative;
  max-width: 190px;
  background: #FFFCF3;
  border: 2px solid #22324F;
  border-radius: 16px 16px 16px 4px;
  padding: 9px 13px;
  font-size: 12.5px;
  line-height: 1.55;
  font-weight: 600;
  color: #33456A;
  box-shadow: 3px 3px 0 rgba(34, 50, 79, .12);
}
.mascot { width: 108px; height: 108px; overflow: visible; }
.mascot .float { animation: floaty 3.6s ease-in-out infinite; transform-origin: 60px 70px; }
.mascot .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.mascot .spark { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.mascot .spark:nth-of-type(2) { animation-delay: .8s; }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-6px) rotate(1.2deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes twinkle { 0%, 100% { transform: scale(.8) rotate(0deg); opacity: .65; } 50% { transform: scale(1.15) rotate(18deg); opacity: 1; } }

/* ================= 布局 ================= */
.layout {
  max-width: 1300px;
  margin: 0 auto;
  padding: 16px 30px 10px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 396px;
  gap: 22px;
  align-items: start;
}
.card {
  background: #FFFCF3;
  border: 2px solid #22324F;
  border-radius: 22px;
  box-shadow: 6px 6px 0 rgba(34, 50, 79, .10);
  padding: 16px 18px;
}
.panel { display: grid; gap: 16px; }

/* ================= 画台 ================= */
.stage-card { padding: 14px 16px 12px; }
.stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 2px 4px 12px;
}
.stage-title {
  font-family: "Songti SC", "STSong", serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.stage-title .dot-sep { color: #C6B893; font-weight: 400; }
.stage-title span:last-child { color: #7C8AA4; font-family: inherit; font-size: 14px; font-weight: 600; }
.badges { display: flex; gap: 8px; }
.badge {
  font-size: 12px;
  font-weight: 700;
  color: #5A6B8C;
  background: #F5EDDB;
  border: 1.5px solid #E2D3B3;
  border-radius: 999px;
  padding: 4px 10px;
  white-space: nowrap;
}
.badge b { color: #22324F; font-size: 13px; }

.stage-wrap {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  background: #FFFDF6;
  border: 2px dashed #DCCBAA;
}
#stage { display: block; width: 100%; height: auto; touch-action: pan-y pinch-zoom; cursor: crosshair; }
.stage-wrap.cutting #stage { cursor: none; }
.stage-hint {
  position: absolute;
  left: 14px;
  bottom: 12px;
  pointer-events: none;
  font-size: 12px;
  font-weight: 600;
  color: #7A6A45;
  background: rgba(255, 252, 243, .86);
  border: 1.5px dashed #DECB9F;
  border-radius: 999px;
  padding: 5px 12px;
  backdrop-filter: blur(2px);
}
.stage-hint.hide { opacity: 0; }
.stage-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 2px 2px;
  flex-wrap: wrap;
}
.grow { flex: 1 1 auto; }

/* ================= 按钮/胶囊 ================= */
.btn {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  color: #22324F;
  background: #FFFCF3;
  border: 2px solid #22324F;
  border-radius: 999px;
  padding: 9px 16px;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(34, 50, 79, .18);
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 rgba(34, 50, 79, .2); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(34, 50, 79, .2); }
.btn.primary {
  background: linear-gradient(180deg, #F7C85C, #E9AE38);
  border-color: #22324F;
}
.btn.ghost { border-style: dashed; box-shadow: none; color: #5A6B8C; }
.btn.wide { width: 100%; margin-top: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 rgba(34,50,79,.1); }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: #5A6B8C;
  cursor: pointer;
  user-select: none;
  padding-left: 4px;
}
.toggle input { accent-color: #D9A537; width: 15px; height: 15px; cursor: pointer; }

/* ================= 侧栏 ================= */
.card-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 12px;
  font-family: "Songti SC", "STSong", serif;
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: .02em;
}
.card-title i {
  display: grid;
  place-items: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #22324F;
  color: #FBEBC6;
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  flex-shrink: 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: #4E5F80;
  background: #FFFDF7;
  border: 1.5px solid #D8C8A8;
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  transition: all .14s ease;
}
.chip:hover { border-color: #22324F; color: #22324F; }
.chip.active {
  background: #22324F;
  border-color: #22324F;
  color: #FBEBC6;
  box-shadow: 0 2px 0 rgba(34, 50, 79, .25);
}

/* 数据格 */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat {
  background: #FBF4E4;
  border: 1.5px solid #E7D9BB;
  border-radius: 14px;
  padding: 9px 12px 8px;
}
.stat span { display: block; font-size: 11px; color: #8A7B5C; font-weight: 600; letter-spacing: .04em; }
.stat b {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  line-height: 1.25;
}
.stat b em { font-style: normal; font-size: 11.5px; font-weight: 700; color: #8A7B5C; margin-left: 2px; }
.kv {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  padding: 6px 2px;
  border-bottom: 1px dashed #EADFC6;
}
.kv:last-child { border-bottom: 0; }
.kv span { color: #7B89A2; font-weight: 600; }
.kv b { font-weight: 700; font-variant-numeric: tabular-nums; }
.note {
  margin: 9px 0 0;
  font-size: 11.5px;
  line-height: 1.6;
  color: #8A7B5C;
  background: #FBF4E4;
  border-radius: 10px;
  padding: 7px 10px;
}

/* 结果 */
.empty {
  text-align: center;
  padding: 16px 8px 18px;
  color: #8A96AD;
  font-size: 13px;
  line-height: 1.7;
}
.empty .big { font-size: 26px; display: block; margin-bottom: 6px; }
.ptable { width: 100%; }
.prow {
  display: grid;
  grid-template-columns: 1.5fr .9fr .9fr .62fr;
  gap: 6px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px dashed #EADFC6;
  font-size: 12.5px;
}
.prow.head {
  border-bottom: 1.5px solid #E4D6B7;
  padding-bottom: 5px;
  padding-top: 0;
}
.prow.head span { font-size: 10.5px; font-weight: 700; color: #9A8B6C; letter-spacing: .02em; }
.prow span.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.prow.head span.num, .prow.head span:nth-child(4) { text-align: right; }
.prow.total { border-bottom: 0; border-top: 1.5px solid #E4D6B7; font-weight: 800; padding-top: 8px; }
.pname { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pname b { font-size: 13px; }
.pname em {
  font-style: normal;
  font-size: 10px;
  color: #93A0B6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.swatch {
  width: 11px; height: 11px;
  border-radius: 3px;
  border: 1.5px solid #22324F;
  flex-shrink: 0;
}
.share {
  display: flex;
  height: 16px;
  border-radius: 999px;
  overflow: hidden;
  border: 2px solid #22324F;
  margin: 12px 0 4px;
  background: #F5EDDB;
}
.share i { display: block; height: 100%; }
.share-legend {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  color: #93A0B6;
  font-weight: 600;
}
.check {
  display: flex;
  gap: 9px;
  background: #F1F8F1;
  border: 1.5px dashed #B4D8BA;
  border-radius: 13px;
  padding: 9px 11px;
  margin-top: 9px;
  font-size: 12px;
  line-height: 1.65;
  color: #3F5A45;
}
.check > b {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 42px; height: 22px;
  border-radius: 7px;
  background: #D6EBD8;
  color: #2F6B3B;
  font-size: 11px;
}
.check .val { font-weight: 800; color: #22324F; font-variant-numeric: tabular-nums; }
.check .ok { color: #2F7B44; font-weight: 700; }
.check .approx { color: #A9762B; font-weight: 700; }
.takeaway {
  margin: 12px 0 0;
  font-size: 12px;
  line-height: 1.7;
  color: #7A6A45;
  background: #FBF1D9;
  border-left: 3px solid #E8B23F;
  border-radius: 0 10px 10px 0;
  padding: 8px 11px;
}
.teaser {
  display: flex;
  gap: 10px;
  align-items: center;
  background: #FBF4E4;
  border: 1.5px dashed #DECB9F;
  border-radius: 14px;
  padding: 11px 13px;
  font-size: 12.5px;
  line-height: 1.6;
  color: #7A6A45;
}
.teaser .emoji { font-size: 22px; }
.teaser b { color: #22324F; }

/* ================= 页脚/提示 ================= */
.foot {
  max-width: 1300px;
  margin: 0 auto;
  padding: 6px 30px 34px;
  font-size: 12px;
  color: #9C8F72;
  text-align: center;
  letter-spacing: .02em;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 20px);
  background: #22324F;
  color: #FFF7E4;
  font-size: 13px;
  font-weight: 600;
  padding: 11px 20px;
  border-radius: 999px;
  box-shadow: 0 8px 24px rgba(34, 50, 79, .28);
  opacity: 0;
  pointer-events: none;
  transition: all .25s ease;
  z-index: 50;
  max-width: 82vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ================= SVG 元素 ================= */
.piece { transform-box: fill-box; transform-origin: center; }
.piece.pop { animation: pop .34s cubic-bezier(.2, 1.5, .5, 1) both; }
@keyframes pop { from { transform: scale(.93); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.seam-flash .seamline { animation: seamflash .75s ease-out both; }
@keyframes seamflash {
  0% { stroke: #E8B23F; stroke-width: .04; opacity: 1; }
  40% { stroke: #FFF3C4; stroke-width: .11; opacity: 1; }
  100% { stroke: #B8860B; stroke-width: .05; opacity: .95; }
}
.mark { pointer-events: none; user-select: none; }
.face { pointer-events: none; }

/* ================= 响应式 ================= */
@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr) 340px; }
  .mascot { width: 92px; height: 92px; }
  .bubble { max-width: 160px; font-size: 12px; }
}
@media (max-width: 900px) {
  .top { padding: 22px 18px 4px; }
  .layout { grid-template-columns: 1fr; padding: 12px 18px 8px; gap: 18px; }
  .mascot-wrap { display: none; }
  .stage-foot { gap: 8px; }
  .btn { padding: 8px 13px; font-size: 12.5px; }
  .foot { padding: 4px 18px 30px; }
}
@media (max-width: 460px) {
  h1 { font-size: 26px; }
  h1 small { display: block; margin: 4px 0 0; font-size: 12px; }
  .stat b { font-size: 19px; }
  .prow { font-size: 12px; }
}

.face .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.4s infinite; }

/* ================= 图形按钮网格 ================= */
.shape-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.shape-grid .chip { width: 100%; padding: 7px 2px; font-size: 12px; text-align: center; grid-column: span 2; }
.shape-grid .chip.wide { grid-column: span 3; }
.ngon-row {
  display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  margin-top: 10px; font-size: 12px; color: #7B89A2; font-weight: 600;
}
.ngon-row input {
  width: 58px; padding: 5px 8px;
  border: 1.5px solid #D8C8A8; border-radius: 9px;
  font: inherit; font-weight: 700; color: #22324F; background: #FFFDF7;
}
.ngon-row input:focus { outline: 2px solid #E8B23F; outline-offset: 1px; }
.ng-item { display: inline-flex; align-items: center; gap: 6px; }
.ng-item em { font-style: normal; color: #A39A82; font-size: 11px; font-weight: 600; }

/* ================= 模式切换 ================= */
.modes { display: flex; background: #F1E7D2; border: 2px solid #22324F; border-radius: 999px; padding: 2px; gap: 2px; }
.mode-btn {
  font: inherit; font-size: 12.5px; font-weight: 700;
  border: 0; background: transparent; color: #6B7A94;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: all .14s ease;
}
.mode-btn:hover { color: #22324F; }
.mode-btn.active { background: #22324F; color: #FBEBC6; box-shadow: 0 2px 0 rgba(34,50,79,.2); }

/* ================= 移动工具条 ================= */
.move-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px; padding: 9px 12px;
  background: #FBF1D9; border: 2px dashed #DEC38A; border-radius: 16px;
}
.move-bar[hidden] { display: none; }
.mb-info { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
.mb-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 700; color: #22324F;
  background: #FFFCF3; border: 1.5px solid #E2D3B3; border-radius: 999px; padding: 4px 10px;
}
.mb-tag .swatch { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid #22324F; }
.mb-hint { color: #8A7B5C; font-size: 11.5px; }
.mb-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tbtn {
  font: inherit; font-size: 12px; font-weight: 700; color: #22324F;
  background: #FFFCF3; border: 1.5px solid #22324F; border-radius: 999px;
  padding: 5px 10px; cursor: pointer; transition: .12s ease; white-space: nowrap;
}
.tbtn:hover:not(:disabled) { background: #F7E6BD; transform: translateY(-1px); }
.tbtn:active:not(:disabled) { transform: translateY(1px); }
.tbtn:disabled { opacity: .4; cursor: not-allowed; }
.tbtn.ghost { border-style: dashed; color: #6B7A94; }
.dim { color: #A39A82; font-weight: 600; }

/* ================= 画布交互光标 ================= */
.stage-wrap.move #stage { cursor: default; }
.stage-wrap.move .piece { cursor: grab; }
.stage-wrap.dragging .piece { cursor: grabbing; }
#labelLayer, #selLayer { pointer-events: none; }

@media (max-width: 460px) {
  .shape-grid { gap: 6px; }
  .shape-grid .chip { font-size: 11.5px; }
  .mb-tools { margin-left: 0; width: 100%; }
}

@media (max-width: 560px) {
  .mb-hint { display: none; }
  .mb-tools { gap: 5px; }
  .tbtn { font-size: 11px; padding: 5px 8px; }
  .move-bar { padding: 8px 10px; gap: 8px; }
}

/* 调整大小模式 */
.stage-wrap.resize #stage { cursor: default; }
.vhandle { pointer-events: none; }
.mb-tools[hidden] { display: none; }
.mb-info .mb-hint { white-space: nowrap; }
@media (max-width: 560px) {
  .mb-info .mb-hint { white-space: normal; }
}

.ngon-tip { font-size: 11px; color: #A39A82; font-weight: 500; }

/* 图形下拉菜单 */
.select-wrap { position: relative; }
.select-wrap select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  color: #22324F;
  background: linear-gradient(180deg, #FFFDF7, #FBF4E4);
  border: 2px solid #22324F;
  border-radius: 14px;
  padding: 10px 36px 10px 14px;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(34, 50, 79, .12);
}
.select-wrap select:focus { outline: 2px solid #E8B23F; outline-offset: 2px; }
.select-caret {
  position: absolute;
  right: 16px;
  top: 50%;
  width: 0;
  height: 0;
  border-left: 5.5px solid transparent;
  border-right: 5.5px solid transparent;
  border-top: 7px solid #22324F;
  transform: translateY(-50%);
  pointer-events: none;
}

/* 操作与读数提示 */
#stageWrap.touch-enabled #stage { touch-action: none; }
.touch-tools { display: none; }
.preview-hint {
  position: absolute; top: 8px; left: 8px; right: 8px; width: fit-content;
  max-width: calc(100% - 16px); padding: 6px 9px; border-radius: 9px;
  background: #fff1ea; color: #8E332D; border: 1px solid #E9B3A2;
  font-size: 12px; line-height: 1.45; font-weight: 700; pointer-events: none;
}
.ngon-row[hidden], .preview-hint[hidden] { display: none; }
.perim-demo {
  margin-top: 12px; padding: 8px 10px; border-radius: 12px; border: 1px solid #DCCBAA;
  background: #FFFCF3; color: #22324F; font-size: 12px; line-height: 1.55;
}
.perim-demo summary { cursor: pointer; font-weight: 700; }

<script>/* ===================== 几何内核 =====================
 * 全部为纯函数，坐标单位 = 厘米，屏幕坐标系（y 向下）。
 * 约定：所有多边形按 shoelace 面积为正的方向存储（makeCCW）。
 * ================================================== */
(function (global) {
  'use strict';

  const EPS = 1e-7;
  const TAU = Math.PI * 2;

  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const unit = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };

  /* ---------- 基本量 ---------- */
  function polyArea(pts) {
    let s = 0;
    for (let i = 0, n = pts.length; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      s += a.x * b.y - b.x * a.y;
    }
    return s / 2;
  }

  function polyPerim(pts) {
    let s = 0;
    for (let i = 0, n = pts.length; i < n; i++) s += dist(pts[i], pts[(i + 1) % n]);
    return s;
  }

  function polyCentroid(pts) {
    let a = 0, cx = 0, cy = 0;
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      const f = p.x * q.y - q.x * p.y;
      a += f; cx += (p.x + q.x) * f; cy += (p.y + q.y) * f;
    }
    a *= 0.5;
    if (Math.abs(a) < 1e-12) {
      let sx = 0, sy = 0;
      for (const p of pts) { sx += p.x; sy += p.y; }
      return { x: sx / n, y: sy / n };
    }
    return { x: cx / (6 * a), y: cy / (6 * a) };
  }

  function pointInPoly(pts, p) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if ((yi > p.y) !== (yj > p.y) && p.x < ((xj - xi) * (p.y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function distToSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  function distToBoundary(pts, p) {
    let best = Infinity;
    for (let i = 0, n = pts.length; i < n; i++) best = Math.min(best, distToSeg(p, pts[i], pts[(i + 1) % n]));
    return best;
  }

  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
      if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
    }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  function makeCCW(pts) {
    return polyArea(pts) < 0 ? pts.slice().reverse() : pts.slice();
  }

  function cornerCount(pts) {
    const n = pts.length;
    let c = 0;
    for (let i = 0; i < n; i++) {
      const a = pts[(i - 1 + n) % n], b = pts[i], d = pts[(i + 1) % n];
      const u = sub(a, b), v = sub(d, b);
      const lu = Math.hypot(u.x, u.y) || 1, lv = Math.hypot(v.x, v.y) || 1;
      const ang = Math.acos(Math.max(-1, Math.min(1, (u.x * v.x + u.y * v.y) / (lu * lv))));
      if (ang > 0.12) c++; /* 约 7° 以下视为共线 */
    }
    return c;
  }

  /* ---------- 一刀：用一条直线把简单多边形切开 ----------
   * A: 直线上一点；d: 单位方向向量。
   * 返回 { pieces:[环...], chordLen, chords:[[p1,p2]...] } 或 null（没切开）。
   * 算法：把交点作为节点，边界弧 + 直线上的“弦”构成平面图，
   *       按角度规则走面（interior 在左），正面积的面就是切出来的块。
   */
  function splitPolygon(poly, A, d) {
    let n = poly.length;
    if (n < 3) return null;
    /* 统一成“正面积”方向，镜像/翻转过的图形也能正确切开 */
    if (polyArea(poly) < 0) poly = poly.slice().reverse();
    const nx = -d.y, ny = d.x;
    const s = new Array(n);
    let hasPos = false, hasNeg = false;
    for (let i = 0; i < n; i++) {
      const v = (poly[i].x - A.x) * nx + (poly[i].y - A.y) * ny;
      s[i] = v;
      if (v > EPS) hasPos = true; else if (v < -EPS) hasNeg = true;
    }
    if (!hasPos || !hasNeg) return null;

    const cuts = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      if ((s[i] > 0) === (s[j] > 0)) continue;
      const t = s[i] / (s[i] - s[j]);
      cuts.push({
        edge: i,
        x: poly[i].x + t * (poly[j].x - poly[i].x),
        y: poly[i].y + t * (poly[j].y - poly[i].y),
        onCircle: !!(poly[i].onCircle && poly[j].onCircle)
      });
    }
    const m = cuts.length;
    if (m < 2 || m % 2 !== 0) return null;

    const node = cuts.map((c) => ({ x: c.x, y: c.y, onCircle: !!c.onCircle }));
    const u = cuts.map((c) => (c.x - A.x) * d.x + (c.y - A.y) * d.y);
    const out = node.map(() => []);
    const dirs = [];
    const chords = [];
    let chordLen = 0;

    function addEdge(a, b, fwdPts, dirAtA, dirAtB) {
      const revPts = fwdPts.slice(0, -1).reverse().concat([node[a]]);
      const idF = dirs.length;
      dirs.push({ from: a, to: b, pts: fwdPts, back: Math.atan2(-dirAtB.y, -dirAtB.x) });
      out[a].push({ id: idF, ang: Math.atan2(dirAtA.y, dirAtA.x) });
      const idR = dirs.length;
      dirs.push({ from: b, to: a, pts: revPts, back: Math.atan2(dirAtA.y, dirAtA.x) });
      out[b].push({ id: idR, ang: Math.atan2(-dirAtB.y, -dirAtB.x) });
    }

    /* 边界弧：节点 k -> k+1（沿多边形走向，包含中间顶点） */
    for (let k = 0; k < m; k++) {
      const k2 = (k + 1) % m;
      const e1 = cuts[k].edge, e2 = cuts[k2].edge;
      const pts = [];
      let idx = (e1 + 1) % n, guard = 0;
      while (true) {
        pts.push(poly[idx]);
        if (idx === e2) break;
        idx = (idx + 1) % n;
        if (++guard > n + 1) break;
      }
      pts.push(node[k2]);
      if (pts.length < 2) continue;
      const dirA = unit(sub(pts[0], node[k]));
      const dirB = unit(sub(node[k2], pts[pts.length - 2]));
      addEdge(k, k2, pts, dirA, dirB);
    }

    /* 直线上的弦：按沿直线排序后两两配对 */
    const order = u.map((_, i) => i).sort((a, b) => u[a] - u[b]);
    for (let i = 0; i + 1 < m; i += 2) {
      const a = order[i], b = order[i + 1];
      const dd = unit(sub(node[b], node[a]));
      if (!dd.x && !dd.y) continue;
      addEdge(a, b, [node[b]], dd, dd);
      chords.push([{ x: node[a].x, y: node[a].y }, { x: node[b].x, y: node[b].y }]);
      chordLen += dist(node[a], node[b]);
    }

    for (const list of out) list.sort((p, q) => p.ang - q.ang);

    const next = new Array(dirs.length).fill(-1);
    for (let i = 0; i < dirs.length; i++) {
      const list = out[dirs[i].to];
      const back = dirs[i].back;
      let best = -1, bestD = Infinity;
      for (const it of list) {
        let diff = back - it.ang;
        diff = ((diff % TAU) + TAU) % TAU;
        if (diff < 1e-9) diff += TAU;
        if (diff < bestD) { bestD = diff; best = it.id; }
      }
      next[i] = best;
    }

    const seen = new Array(dirs.length).fill(false);
    const pieces = [];
    for (let i = 0; i < dirs.length; i++) {
      if (seen[i]) continue;
      const ring = [];
      let cur = i, closed = false, steps = 0;
      while (steps++ < dirs.length + 6) {
        if (seen[cur]) break;
        seen[cur] = true;
        const e = dirs[cur];
        for (const p of e.pts) {
          const last = ring[ring.length - 1];
          if (!last || Math.hypot(last.x - p.x, last.y - p.y) > 1e-9) ring.push(p);
        }
        cur = next[cur];
        if (cur === i) { closed = true; break; }
        if (cur < 0) break;
      }
      if (!closed || ring.length < 3) continue;
      if (Math.hypot(ring[0].x - ring[ring.length - 1].x, ring[0].y - ring[ring.length - 1].y) < 1e-9) ring.pop();
      const ar = polyArea(ring);
      if (ar > 1e-6) pieces.push({ pts: ring, area: ar });
    }
    if (!pieces.length) return null;
    return { pieces: pieces.map((p) => p.pts), areas: pieces.map((p) => p.area), chordLen, chords };
  }

  /* ---------- 常见平面图形（以原点为中心，y 向下） ---------- */
  function equilateralTriangle(s) {
    const h = (s * Math.sqrt(3)) / 2;
    return makeCCW([{ x: 0, y: (-2 * h) / 3 }, { x: s / 2, y: h / 3 }, { x: -s / 2, y: h / 3 }]);
  }

  function isoscelesTriangle(b, h) {
    return makeCCW([{ x: 0, y: (-2 * h) / 3 }, { x: b / 2, y: h / 3 }, { x: -b / 2, y: h / 3 }]);
  }

  function rightTriangle(a, b) {
    /* 直角在左下角，两条直角边长为 a、b */
    const g = { x: a / 3, y: -b / 3 };
    return makeCCW([{ x: -g.x, y: -g.y }, { x: a - g.x, y: -g.y }, { x: -g.x, y: -b - g.y }]);
  }

  function rectangle(w, h) {
    return makeCCW([{ x: -w / 2, y: -h / 2 }, { x: w / 2, y: -h / 2 }, { x: w / 2, y: h / 2 }, { x: -w / 2, y: h / 2 }]);
  }

  function parallelogram(b, h, s) {
    return makeCCW([
      { x: -b / 2, y: h / 2 }, { x: b / 2, y: h / 2 },
